services:
  - type: web
    name: business-consultant-system-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://business-consultant-system.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        value: mongodb://localhost:27017/dashen_ai_consultant

  - type: static
    name: business-consultant-system
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://business-consultant-system-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
